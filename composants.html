<!--  HEADER    -->
<header class="bg-[#355C4A] text-white sticky top-0 z-50 shadow-sm">
    <input type="checkbox" id="menu-toggle" class="peer hidden" />

    <div class="max-w-[1280px] mx-auto px-4 md:px-8 lg:px-12 h-14 md:h-16 flex items-center justify-between">
        <!-- Logo DarNature -->
        <a href="index.html" class="flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-white/40 rounded-sm" aria-label="DarNature - Accueil">
            <div class="bg-[#FAF7F0] w-8 h-8 md:w-9 md:h-9 rounded-md flex items-center justify-center p-1.5 shadow-xs">
                <img src="images/logo.png" alt="logo DarNature" />
            </div>
        </a>

        <!-- Actions : Panier + Toggle Mobile -->
        <div class="flex items-center gap-3">
            <!-- Liens Desktop & Tablette -->
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium" aria-label="Navigation principale">
                <a href="index.html" class="text-white/80 hover:text-white pb-0.5 border-b-2 border-transparent transition-colors">Accueil</a>
                <a href="catalogue.html" class="text-white font-semibold pb-0.5 border-b-2 border-white transition-colors" aria-current="page">Catalogue</a>
                <a href="contact.html" class="text-white/80 hover:text-white pb-0.5 border-b-2 border-transparent transition-colors">Contact</a>
            </nav>
            <!-- Panier -->
            <a
                href="panier.html"
                aria-label="Voir le panier d'achat"
                class="mx-5 relative text-white hover:text-white/80 p-1 focus:outline-none focus:ring-2 focus:ring-white/40 rounded-sm transition-colors"
            >
                <svg width="24" height="24" class="w-6 h-6 shrink-0" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"
                    />
                </svg>
                <span class="absolute -top-1 -right-1 bg-[#C77B4A] text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">2</span>
            </a>

            <!-- Bouton Burger  -->
            <label for="menu-toggle" class="md:hidden p-1 text-white cursor-pointer select-none focus:outline-none focus:ring-2 focus:ring-white/40 rounded-sm" aria-label="Menu de navigation">
                <svg width="24" height="24" class="w-6 h-6 block peer-checked:hidden shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <svg width="24" height="24" class="w-6 h-6 hidden peer-checked:block shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </label>
        </div>
    </div>

    <!-- Tiroir Mobile -->
    <nav aria-label="Navigation mobile" class="hidden peer-checked:block md:hidden bg-[#24372D] border-t border-white/10 px-4 py-4 space-y-2">
        <a href="index.html" class="block py-2 px-3 text-sm font-medium rounded-md text-white/80 hover:text-white hover:bg-white/5 transition-colors">Accueil</a>
        <a href="catalogue.html" class="block py-2 px-3 text-sm font-medium rounded-md bg-white/10 text-white" aria-current="page">Catalogue</a>
        <a href="contact.html" class="block py-2 px-3 text-sm font-medium rounded-md text-white/80 hover:text-white hover:bg-white/5 transition-colors">Contact</a>
        <a href="panier.html" class="block py-2 px-3 text-sm font-medium rounded-md text-white/80 hover:text-white hover:bg-white/5 transition-colors">Mon Panier (2)</a>
    </nav>
