<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Catalogue officiel DarNature — Produits artisanaux, soins naturels et créations écoresponsables." />
  <title>Contact — DarNature</title>

  <!-- Google Fonts: Poppins & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="dist/output.css" />
  <link rel="stylesheet" href="src/style.css" />
  <link rel="stylesheet" href="src/input.css" />

  <style>
    .contact-page {
      width: 100%;
      background-color: #FAF7F0;
      color: #252A25;
      font-family: Arial, sans-serif;
    }

    .contact-container {
      box-sizing: border-box;
      width: 100%;
      padding: 38px 8.2% 50px;
    }

    .contact-title {
      margin: 0 0 25px;
      color: #252A25;
      font-size: 42px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -1px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 19px;
    }

    .contact-field {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 100%;
    }

    .contact-field label {
      color: #252A25;
      font-size: 25px;
      font-weight: 400;
    }

    .contact-field input,
    .contact-field textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 17px 25px;
      border: 1.5px solid #B9AEA0;
      border-radius: 15px;
      background-color: #E8E0D2;
      color: #252A25;
      font-family: inherit;
      font-size: 18px;
    }

    .contact-field input {
      height: 63px;
    }

    .contact-field textarea {
      min-height: 128px;
      resize: vertical;
    }

    .contact-field input::placeholder,
    .contact-field textarea::placeholder {
      color: #6F6A61;
      opacity: 1;
    }

    .contact-field input:focus,
    .contact-field textarea:focus {
      outline: 2px solid #355C4A;
      outline-offset: 1px;
    }

    .contact-button {
      width: 150px;
      height: 50px;
      max-width: 100%;
      margin-top: 1px;
      padding: 0 15px;
      border: none;
      border-radius: 8px;
      background-color: #355C4A;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    .contact-button:hover {
      background-color: #294839;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .contact-container {
        padding: 28px 6% 35px;
      }

      .contact-title {
        font-size: 32px;
      }

      .contact-field label {
        font-size: 20px;
      }

      .contact-field input,
      .contact-field textarea {
        padding: 15px 18px;
        font-size: 16px;
      }

      .contact-field input {
        height: 56px;
      }

      .contact-button {
        width: 100%;
        height: 48px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body class="bg-background text-text font-body min-h-screen flex flex-col justify-between antialiased">

  <!--  HEADER  start    -->
  <header class="bg-[#355C4A] text-white sticky top-0 z-50 shadow-sm">
    <input type="checkbox" id="menu-toggle" class="peer hidden" />

    <div class="max-w-[1280px] mx-auto px-4 md:px-8 lg:px-12 h-14 md:h-16 flex items-center justify-between">
      <!-- Logo DarNature -->
      <a href="index.html"
        class="flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-white/40 rounded-sm"
        aria-label="DarNature - Accueil">
        <div class="bg-[#FAF7F0] w-8 h-8 md:w-9 md:h-9 rounded-md flex items-center justify-center p-1.5 shadow-xs">
          <img src="images/logo.png" alt="logo DarNature" />
        </div>
      </a>
      <div class="flex items-center gap-3">
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium" aria-label="Navigation principale">
          <a href="index.html"
            class="text-white/80 hover:text-white pb-0.5 border-b-2 border-transparent transition-colors">Accueil</a>
          
          <a href="catalogue.html"
            class="text-white/80 hover:text-white pb-0.5 border-b-2 border-transparent transition-colors">Catalogue</a>
          <a href="contact.html" class="text-white font-semibold pb-0.5 border-b-2 border-white transition-colors"
            aria-current="page">Contact</a>


        </nav>
        <!-- Panier -->
        <a href="panier.html" aria-label="Voir le panier d'achat"
          class="mx-5 relative text-white hover:text-white/80 p-1 focus:outline-none focus:ring-2 focus:ring-white/40 rounded-sm transition-colors">
          <svg width="24" height="24" class="w-6 h-6 shrink-0" fill="currentColor" viewBox="0 0 24 24"
            aria-hidden="true">
            <path
              d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" />
          </svg>
          <span
            class="absolute -top-1 -right-1 bg-[#C77B4A] text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">2</span>
        </a>

        <!-- Bouton Burger  -->
        <label for="menu-toggle"
          class="md:hidden p-1 text-white cursor-pointer select-none focus:outline-none focus:ring-2 focus:ring-white/40 rounded-sm"
          aria-label="Menu de navigation">
          <svg width="24" height="24" class="w-6 h-6 block peer-checked:hidden shrink-0" fill="none"
            stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg width="24" height="24" class="w-6 h-6 hidden peer-checked:block shrink-0" fill="none"
            stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </label>
      </div>
    </div>

    <!-- Tiroir Mobile -->
    <nav aria-label="Navigation mobile"
      class="hidden peer-checked:block md:hidden bg-[#24372D] border-t border-white/10 px-4 py-4 space-y-2">
      <a href="index.html"
        class="block py-2 px-3 text-sm font-medium rounded-md text-white/80 hover:text-white hover:bg-white/5 transition-colors">Accueil</a>
      <a href="catalogue.html" class="block py-2 px-3 text-sm font-medium rounded-md bg-white/10 text-white"
        aria-current="page">Catalogue</a>
      <a href="contact.html"
        class="block py-2 px-3 text-sm font-medium rounded-md text-white/80 hover:text-white hover:bg-white/5 transition-colors">Contact</a>

    </nav>
  </header>
  <!--  HEADER  end     -->
  <!-- ================================================================= -->
  <!-- CONTACT SECTION                                   -->
  <!-- ================================================================= -->
  <main class="contact-page">
    <section class="contact-container">
      <!-- Title -->
      <h1 class="contact-title">
        FORMULAIRE DE<br>
        CONTACT
      </h1>

      <!-- Contact Form -->
      <form action="#" method="post" class="contact-form">
        <!-- Nom complet -->
        <div class="contact-field">
          <label for="nom">Nom complet</label>
          <input type="text" id="nom" name="nom" placeholder="p. ex. Jean Dupont" required>
        </div>

        <!-- Adresse e-mail -->
        <div class="contact-field">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" placeholder="p. ex. dupont@email.com" required>
        </div>

        <!-- Téléphone -->
        <div class="contact-field">
          <label for="telephone">Téléphone</label>
          <input type="tel" id="telephone" name="telephone" placeholder="+212 524 000 000">
        </div>

        <!-- Sujet -->
        <div class="contact-field">
          <label for="sujet">Sujet</label>
          <input type="text" id="sujet" name="sujet" placeholder="Sujet de votre message" required>
        </div>

        <!-- Message -->
        <div class="contact-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" placeholder="Votre message ici..." required></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="contact-button">
          ENVOYER
        </button>
      </form>
    </section>
  </main>
  <!-- End Contact Section -->

  <!-- ================================================================= -->
  <!-- 4. FOOTER                                               -->
  <!-- ================================================================= -->

        <div class="footer-logo">
          <img src="images/logo.png" alt="ABC Company logo" width="200" height="200" />
        </div>

        <div class="footer-contact">

                d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
            </svg>
            <span class="footer-text">ABC Company, 123 East, 17th Street, St. louis 10001</span>
          </div>

          <!-- Email -->
          <div class="contact-item">
            <svg class="icon" width="23" height="23" fill="none" stroke="currentColor" viewBox="0 0 24 24"
              aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

            </svg>
            <a class="footer-text" href="mailto:absdem@gmail.com">absdem@gmail.com</a>
          </div>

          <!-- Phone -->
          <div class="contact-item">
            <svg class="icon" width="23" height="23" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" />
            </svg>
            <a class="footer-text" href="tel:1234567890">(123) 456-7890</a>
          </div>
        </div>

        <!-- Social media -->
        <div class="footer-social">
          <span class="social-label">Social Media</span>
          <a href="#" aria-label="Twitter" class="social-link">
            <svg class="icon" width="23" height="23" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71 0-1.37-.2-1.95-.5v.05c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 0 1-1.93.07 4.28 4.28 0 0 0 4 2.98 8.521 8.521 0 0 1-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23z" />

      </div>

  </footer>

</body>

</html>
